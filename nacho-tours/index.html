<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Amore Paraíso — Transport Schedule</title>
<style>
  :root{
    --blush:#F3D7D3; --rose:#E79D9B; --mauve:#504242; --sage:#86A864;
    --blush-tint:#fdf9f8; --sage-tint:#f7faf3; --line:#ecdedc; --ink:#504242;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:#f4eeec; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:780px; margin:0 auto; padding:18px 16px 80px;}
  svg.ic{width:1em; height:1em; vertical-align:-0.12em; fill:none; stroke:currentColor;
    stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}

  header{text-align:center; padding:18px 0 6px;}
  header .brand{font-family:Georgia,serif; font-style:italic; color:var(--rose);
    font-size:30px; letter-spacing:.5px;}
  header .sub{text-transform:uppercase; letter-spacing:3px; font-size:11px;
    color:var(--mauve); margin-top:6px; opacity:.75;}

  .controls{display:flex; gap:10px; align-items:center; justify-content:space-between;
    flex-wrap:wrap; margin:18px 0 4px; border-top:1px solid var(--line); padding-top:14px;}
  .controls .count{font-size:13px; color:var(--mauve); opacity:.8;}
  .btn-ghost{background:#fff; border:1px solid var(--line); color:var(--mauve);
    padding:6px 13px; border-radius:999px; font-size:13px; cursor:pointer;}
  .btn-ghost.active{background:var(--mauve); color:#fff; border-color:var(--mauve);}

  /* collapsible day */
  .day{margin-top:22px;}
  .day-head{display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none; padding:6px 2px;}
  .day-head .chev{transition:transform .2s; color:var(--rose); display:inline-flex;}
  .day.collapsed .chev{transform:rotate(-90deg);}
  .day-head .d-date{font-family:Georgia,serif; font-size:18px; font-weight:600; color:var(--mauve);}
  .day-head .d-rel{font-size:11px; text-transform:uppercase; letter-spacing:1.2px;
    color:#fff; background:var(--sage); padding:3px 9px; border-radius:999px;}
  .day-head .d-rel.today{background:var(--rose);}
  .day-head .d-rel.past{background:#b9aaa8;}
  .day-head .d-mini{font-size:12px; color:#a79896; opacity:.7;}
  .day-head .d-line{flex:1; height:1px; background:var(--line);}
  .day.collapsed .day-body{display:none;}

  .pax-list{margin:3px 0 0; padding:0; list-style:none; font-size:14px; line-height:1.65;}
  .pax-list li{padding-left:14px; position:relative;}
  .pax-list li::before{content:""; position:absolute; left:0; top:9px; width:5px; height:5px;
    border-radius:50%; background:var(--rose);}
  .lbl{font-size:10px; text-transform:uppercase; letter-spacing:1.3px; opacity:.55;}

  /* status buttons */
  .status-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:13px; padding-top:12px; border-top:1px solid var(--line);}
  .status-btn{flex:1; min-width:115px; border:1.5px solid var(--line); background:#fff;
    color:var(--mauve); padding:9px 8px; border-radius:9px; font-size:12.5px; font-weight:600;
    cursor:not-allowed; display:flex; align-items:center; justify-content:center; gap:6px; opacity:.85;}
  .status-note{width:100%; text-align:center; font-size:11px; color:#b9aaa8; font-style:italic; margin-top:1px;}

  /* TIMELINE (Style 3) */
  .rail{position:relative; padding-left:30px;}
  .rail::before{content:""; position:absolute; left:9px; top:6px; bottom:6px; width:2px; background:var(--blush);}
  .stop{position:relative; margin-bottom:16px;}
  .stop .dot{position:absolute; left:-29px; top:4px; width:20px; height:20px; border-radius:50%;
    background:#fff; border:3px solid var(--rose); display:flex; align-items:center; justify-content:center;}
  .stop.arrival .dot{border-color:var(--sage);}
  .stop .dot svg{width:10px; height:10px; stroke:var(--mauve);}
  .card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px;}
  .stoptime{font-family:Georgia,serif; font-size:18px; font-weight:700; color:var(--mauve);
    display:inline-block; margin-bottom:1px;}
  .stoptime .dir{font-size:11px; text-transform:uppercase; letter-spacing:1.2px; margin-left:8px;
    padding:2px 8px; border-radius:999px; color:#fff; vertical-align:middle;}
  .stoptime .dir.arrival{background:var(--sage);} .stoptime .dir.return{background:var(--rose);}
  .wed{font-size:11px; text-transform:uppercase; letter-spacing:1.4px; color:var(--sage); font-weight:700; margin-top:6px;}
  .route{font-family:Georgia,serif; font-size:16px; font-weight:600; margin:2px 0 0;}
  .grp{border-left:3px solid var(--blush); padding:4px 0 4px 12px; margin-top:10px;}
  .grp-flight{font-weight:700; color:var(--mauve);}
  .grp-when{color:var(--sage); font-size:13px; font-weight:600;}
  .notes{margin-top:10px; font-size:13.5px; color:#7a6c6a; background:var(--sage-tint); border-radius:8px; padding:8px 11px;}

  .empty{text-align:center; padding:60px 20px; color:#b9aaa8; font-family:Georgia,serif; font-size:18px;}
  footer{text-align:center; margin-top:42px; font-size:12px; color:#b9aaa8;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Amore Paraíso</div>
    <div class="sub">Transport Schedule · Driver Run Sheet</div>
  </header>

  <div class="controls">
    <div class="count" id="count"></div>
    <div>
      <button class="btn-ghost active" id="f-up" onclick="setView('upcoming')">Upcoming</button>
      <button class="btn-ghost" id="f-all" onclick="setView('all')">Show past</button>
    </div>
  </div>

  <div id="schedule"></div>

  <footer>Times are local (Costa Rica). Confirm flight times before each run.</footer>
</div>

  users:'<svg class="ic" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>',
  phone:'<svg class="ic" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
  van:'<svg class="ic" viewBox="0 0 24 24"><path d="M1 3h13v13H1z"/><path d="M14 8h4l3 3v5h-7z"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
  check:'<svg class="ic" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
  flag:'<svg class="ic" viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>'
};

let view='upcoming';
const collapsed = {};

function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}
function relLabel(ds,t){
  if(ds<t)return{txt:'Past',cls:'past'}; if(ds===t)return{txt:'Today',cls:'today'};
  const[y,m,d]=ds.split('-').map(Number),[ty,tm,td]=t.split('-').map(Number);
  const diff=Math.round((new Date(y,m-1,d)-new Date(ty,tm-1,td))/86400000);
  if(diff===1)return{txt:'Tomorrow',cls:''}; return{txt:'In '+diff+' days',cls:''};
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function paxTotal(b){return (b.groups||[]).reduce((n,g)=>n+(g.passengers?g.passengers.length:0),0);}
function paxUL(g){return '<ul class="pax-list">'+(g.passengers||[]).map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul>';}

function statusRow(){
  return '<div class="status-row">'+
    '<button class="status-btn" disabled>'+IC.van+' On the way</button>'+
    '<button class="status-btn" disabled>'+IC.check+' Everyone collected</button>'+
    '<button class="status-btn" disabled>'+IC.flag+' Dropped off</button>'+
    '<div class="status-note">Status buttons — coming soon (will notify Stefano)</div>'+
  '</div>';
}

function card(b){
  const isArr=b.type==='arrival', shared=b.groups.length>1;
  const grps=b.groups.map(g=>
    '<div class="grp"><span class="grp-flight">'+esc(g.airline)+' '+esc(g.flight)+'</span> '+
      '<span class="grp-when">· '+esc(g.when)+'</span>'+paxUL(g)+'</div>').join('');
  return '<div class="stop '+b.type+'"><div class="dot">'+(isArr?IC.down:IC.up)+'</div>'+
    '<div class="card">'+
      '<span class="stoptime">'+esc(b.time)+'<span class="dir '+b.type+'">'+(isArr?'Arrival':'Return')+(shared?' · shared':'')+'</span></span>'+
      '<div class="wed">'+esc(b.wedding)+'</div>'+
      '<div class="route">'+esc(b.from)+' → '+esc(b.to)+'</div>'+
      '<div class="lbl" style="margin-top:6px">'+IC.users+' '+paxTotal(b)+' passenger'+(paxTotal(b)>1?'s':'')+'</div>'+
      grps+
      (b.phone?'<div style="margin-top:8px;font-size:13px">'+IC.phone+' '+esc(b.phone)+'</div>':'')+
      (b.notes?'<div class="notes">'+esc(b.notes)+'</div>':'')+
      statusRow()+
    '</div></div>';
}

function render(){
  const today=todayStr();
  const sched=document.getElementById('schedule');
  sched.innerHTML='';
  let rows=BOOKINGS.slice();
  if(view==='upcoming') rows=rows.filter(b=>b.date>=today);
  rows.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));

  document.getElementById('count').textContent=
    rows.length+(rows.length===1?' transfer':' transfers')+(view==='upcoming'?' upcoming':' total');

  if(!rows.length){sched.innerHTML='<div class="empty">No upcoming transfers — all caught up.</div>';return;}

  const byDate={};
  rows.forEach(b=>{(byDate[b.date]=byDate[b.date]||[]).push(b);});

  Object.keys(byDate).sort().forEach(date=>{
    const rel=relLabel(date,today);
    const isCol=!!collapsed[date];
    const day=document.createElement('div');
    day.className='day'+(isCol?' collapsed':'');
    const runs=byDate[date];
    const head=document.createElement('div');
    head.className='day-head';
    head.innerHTML='<span class="chev">'+IC.chev+'</span>'+
      '<span class="d-date">'+fmtDate(date)+'</span>'+
      '<span class="d-rel '+rel.cls+'">'+rel.txt+'</span>'+
      '<span class="d-mini">'+runs.length+' run'+(runs.length>1?'s':'')+'</span>'+
      '<span class="d-line"></span>';
    head.onclick=()=>{collapsed[date]=!collapsed[date]; render();};
    const body=document.createElement('div'); body.className='day-body';
    body.innerHTML='<div class="rail">'+runs.map(card).join('')+'</div>';
    day.appendChild(head); day.appendChild(body);
    sched.appendChild(day);
  });
}

function setView(v){
  view=v;
  document.getElementById('f-up').classList.toggle('active',v==='upcoming');
  document.getElementById('f-all').classList.toggle('active',v==='all');
  render();
}

render();
</script>
</body>
</html>
